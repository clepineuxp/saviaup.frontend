name: Frontend component pipeline

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      angular_project:
        required: true
        type: string
      dist_project:
        required: true
        type: string
      component_path:
        required: true
        type: string
      deployment_name:
        required: true
        type: string
      apply_ingress:
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io

jobs:
  build-publish-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ inputs.image_name }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: 5. Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ANGULAR_PROJECT=${{ inputs.angular_project }}
            DIST_PROJECT=${{ inputs.dist_project }}
          cache-from: type=gha,scope=${{ inputs.deployment_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.deployment_name }}

      - name: 6. Determine target environment
        id: env-detect
        shell: bash
        run: |
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "env=dev" >> "$GITHUB_OUTPUT"
            echo "ns=saviaup-dev" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/qa" ]; then
            echo "env=qa" >> "$GITHUB_OUTPUT"
            echo "ns=saviaup-qa" >> "$GITHUB_OUTPUT"
          else
            echo "env=prod" >> "$GITHUB_OUTPUT"
            echo "ns=saviaup-prod" >> "$GITHUB_OUTPUT"
          fi

      - name: 7. Deploy and verify rollout
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            DEPLOY_ENV="${{ steps.env-detect.outputs.env }}"
            NAMESPACE="${{ steps.env-detect.outputs.ns }}"
            BASE_PATH="/opt/saviaup/deploys/$DEPLOY_ENV"
            COMPONENT_PATH="$BASE_PATH/${{ inputs.component_path }}"
            DEPLOYMENT="${{ inputs.deployment_name }}"

            if [ "${{ inputs.apply_ingress }}" = "true" ] && [ -f "$BASE_PATH/ingress.yaml" ]; then
              kubectl apply -f "$BASE_PATH/ingress.yaml"
            fi

            if [ ! -d "$COMPONENT_PATH" ]; then
              echo "No se encontró la carpeta $COMPONENT_PATH"
              exit 1
            fi

            if [ -f "$COMPONENT_PATH/secret.yaml" ]; then
              kubectl apply -f "$COMPONENT_PATH/secret.yaml"
            fi
            kubectl apply -f "$COMPONENT_PATH/"
            kubectl rollout restart "deployment/$DEPLOYMENT" -n "$NAMESPACE"
            kubectl rollout status "deployment/$DEPLOYMENT" -n "$NAMESPACE" --timeout=120s
