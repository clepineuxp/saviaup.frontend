server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Runtime environment config (no cache so pod reboots / config updates apply immediately)
    location = /env-config.js {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # The version manifest and worker scripts must never use immutable caching.
    location = /ngsw.json {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    location ~ ^/(?:ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js)$ {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # Only content-hashed Angular bundles are immutable.
    location ~* "/[^/]+-[a-z0-9]{8,}\.(?:css|js)$" {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp|webmanifest)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA routing - fallback to index.html with no-cache
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Health check endpoint
    location = /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
