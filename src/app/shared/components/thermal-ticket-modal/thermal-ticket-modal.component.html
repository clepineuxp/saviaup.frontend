<div
  class="sub-modal-backdrop print-modal-backdrop"
  tabindex="0"
  (click)="closeFromBackdrop($event)"
  (keydown.escape)="closed.emit()"
>
  <div class="sub-modal print-modal">
    <header class="sub-modal-header no-print">
      <h3>🖨️ Comprobante de Tirilla (#{{ receipt().receiptNumber }})</h3>
      <button type="button" class="close-btn-icon" (click)="closed.emit()">✕</button>
    </header>

    <div class="sub-modal-body print-modal-body">
      <div #ticketContent class="ticket-content-host">
        <app-thermal-ticket-content
          [receipt]="receipt()"
          [template]="printTemplate()"
          [organization]="settingsStore.organization()"
          [business]="settingsStore.business()"
          [logoUrl]="logoUrl()"
          [tableName]="tableName()"
          [orderNumber]="orderNumber()"
        />
      </div>
    </div>

    <footer class="sub-modal-footer no-print">
      <button type="button" class="btn-cancel" (click)="closed.emit()">Cerrar</button>
      <button type="button" class="btn-confirm primary print-btn" (click)="triggerPrint()">
        🖨️ Imprimir Tirilla
      </button>
    </footer>
  </div>
</div>
